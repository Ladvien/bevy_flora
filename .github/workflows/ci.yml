name: CI

on:
  push:
    branches: ["**"]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: build + test + lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Bevy's Linux build needs ALSA / udev / windowing headers for the
      # examples, even though no test opens a window: every test here is CPU
      # geometry.
      - name: Install Bevy build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libasound2-dev libudev-dev libwayland-dev libxkbcommon-dev

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2

      # `build` before `test`, on purpose: `cargo test` compiles the
      # dev-dependency `bevy` with default features, and Cargo unifies features,
      # so a missing entry in the crate's own `bevy` feature list cannot fail
      # there. A plain `cargo build` compiles exactly what a consumer gets.
      - name: Build with only the declared features
        run: cargo build --release

      - name: Build with serde
        run: cargo build --release --features serde

      - name: Test
        run: cargo test --all-features

      - name: Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Docs
        run: cargo doc --no-deps --all-features
        env:
          RUSTDOCFLAGS: -D warnings

      # The examples open a window or render offscreen when run; building them
      # needs no display.
      - name: Build examples
        run: cargo build --examples

      - name: Package
        run: cargo package --locked
