name: CI

on:
  push:
    branches: ["**"]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: build + test + lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Bevy's Linux build needs ALSA / udev / windowing headers for the
      # examples, even though no test opens a window: every test here is CPU
      # geometry.
      - name: Install Bevy build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libasound2-dev libudev-dev libwayland-dev libxkbcommon-dev

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2

      # `build` before `test`, on purpose: `cargo test` compiles the
      # dev-dependency `bevy` with default features, and Cargo unifies features,
      # so a missing entry in the crate's own `bevy` feature list cannot fail
      # there. A plain `cargo build` compiles exactly what a consumer gets.
      - name: Build with only the declared features
        run: cargo build --release

      - name: Build with serde
        run: cargo build --release --features serde

      - name: Test
        run: cargo test --all-features

      - name: Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Docs
        run: cargo doc --no-deps --all-features
        env:
          RUSTDOCFLAGS: -D warnings

      # The examples open a window or render offscreen when run; building them
      # needs no display.
      - name: Build examples
        run: cargo build --examples

      - name: Package
        run: cargo package --locked

  # The build job never opens a graphics device, so nothing in it compiles the
  # growth vertex shaders. This job renders for real on a software Vulkan driver
  # (lavapipe) inside a virtual X display: the same scenarios once with the CPU
  # rebuild and once with `GpuGrowth`, which must come out close.
  gpu-smoke:
    name: GPU growth on software Vulkan
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Install Bevy build dependencies and a software Vulkan driver
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libasound2-dev libudev-dev libwayland-dev libxkbcommon-dev \
            mesa-vulkan-drivers libvulkan1 xvfb libx11-6 libxcursor1 libxi6 libxrandr2 libxkbcommon-x11-0

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          key: gpu-smoke

      - name: Build the examples
        run: cargo build --release --example gallery --example compare_gallery --example forest

      - name: Render with the CPU rebuild
        shell: bash
        run: |
          mkdir -p target/ci
          xvfb-run -a cargo run --release --example gallery -- --warmup-secs 20 --out target/ci/cpu \
            --filter grow_oak_4 --filter grow_oak_6 --filter age_spruce_6 --filter smoothyoung_spruce_4 \
            --filter age_willow_6 --filter smoothyoung_oak_4 --filter pipeyoung_pine_5 \
            2>&1 | tee target/ci/cpu.log

      # `gallery --gpu` exits with an error when the device cannot grow trees on
      # the GPU, so a quiet fall back to the CPU path cannot pass this step.
      - name: Render with GpuGrowth
        shell: bash
        run: |
          xvfb-run -a cargo run --release --example gallery -- --gpu --warmup-secs 20 --out target/ci/gpu \
            --filter grow_oak_4 --filter grow_oak_6 --filter age_spruce_6 --filter smoothyoung_spruce_4 \
            --filter age_willow_6 --filter smoothyoung_oak_4 --filter pipeyoung_pine_5 \
            2>&1 | tee target/ci/gpu.log
          if grep -E "ERROR|panicked" target/ci/gpu.log; then exit 1; fi

      # A capture that came back empty (the software renderer was still compiling
      # shaders) would compare as "the same" with another empty one.
      - name: Check that no capture came back empty
        shell: bash
        run: |
          if grep -E "BLANK_CAPTURE|CAPTURE_TIMEOUT" target/ci/cpu/stats.tsv target/ci/gpu/stats.tsv; then exit 1; fi

      - name: Compare the two renders
        run: cargo run --release --example compare_gallery -- target/ci/cpu target/ci/gpu

      # The forest path bakes the impostors (an offscreen render read back) and
      # draws a pool through the instanced levels of detail and the impostor
      # shader, none of which a headless test compiles or runs. The example exits
      # with an error when a pool ends up without impostors.
      - name: Render a pooled forest
        shell: bash
        run: |
          xvfb-run -a cargo run --release --example forest -- --mode pool --trees 400 --spacing 20 \
            --lod 20,40,60 --warmup-secs 20 --screenshot target/ci/forest.png \
            2>&1 | tee target/ci/forest.log
          if grep -E "ERROR|panicked" target/ci/forest.log; then exit 1; fi
          test -s target/ci/forest.png

      - name: Keep the renders when the job fails
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: gpu-smoke-renders
          path: target/ci
