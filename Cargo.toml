[package]
name = "bevy_flora"
version = "0.25.0"
edition = "2024"
# Bevy 0.20's own crates declare 1.97.1, and this crate cannot compile without
# them, so claiming less would be a floor nothing can stand on.
rust-version = "1.97.1"
description = "Parametric, stylized procedural trees and shrubs for Bevy that grow over time: 16 presets, bent and forking branches, CC0 bark and leaf scans, painterly and toon looks, deterministic per seed."
license = "MIT OR Apache-2.0"
repository = "https://github.com/Ladvien/bevy_flora"
documentation = "https://docs.rs/bevy_flora"
readme = "README.md"
authors = ["C. Thomas Brittain <cthomasbrittain@hotmail.com>"]
# `bevy` first: it is the term a Bevy user searches, and crates.io weights
# keyword position. At the 5-item cap.
keywords = ["bevy", "procedural", "tree", "vegetation", "gamedev"]
categories = ["game-development", "graphics", "rendering"]
# The package is the library and its examples. `qa/` (the visual QA log),
# `slop/` (old design notes), `docs/` (README media, served from GitHub), `tools/`
# (the texture preparation script) and the agent guide stay in the repository only.
include = [
    "src/**/*",
    "examples/**/*",
    "Cargo.toml",
    "README.md",
    "CHANGELOG.md",
    "ARCHITECTURE.md",
    "LICENSE-MIT",
    "LICENSE-APACHE",
]

[package.metadata.docs.rs]
all-features = true

[dependencies]
bevy = { version = "0.20", default-features = false, features = ["std", "bevy_asset", "bevy_color", "bevy_log", "bevy_mesh", "bevy_pbr", "jpeg"] }
serde = { version = "1", features = ["derive"], optional = true }
ron = { version = "0.12", optional = true }

[features]
default = ["textures"]
# The bundled CC0 bark scans and leaf atlases: about 3.6 MB of JPEG compiled into the crate.
# Without it every scan is absent: wood is plain colour and leaves keep their procedural outline.
textures = []
serde = ["dep:serde"]
# `.tree.ron` files: an asset loader for `TreeParams`, and `TreeParams::to_ron` / `from_ron`.
# `ron` is already in Bevy's dependency graph (`bevy_asset` reads `.meta` files with it).
ron = ["serde", "dep:ron"]
# Bevy's `file_watcher`: assets reload when their files are saved, so `.tree.ron` trees rebuild
# (the `tree_file` example). Not on by default: with it, an app without an `assets` folder warns.
file_watcher = ["bevy/file_watcher"]

[dev-dependencies]
bevy = { version = "0.20" }

[[example]]
name = "tree_file"
required-features = ["ron"]

[lints.rust]
missing_docs = "warn"
unsafe_code = "forbid"

[lints.clippy]
all = { level = "warn", priority = -1 }
todo = "deny"
unimplemented = "deny"
dbg_macro = "deny"

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3
